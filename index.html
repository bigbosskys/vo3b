        // ═══════════════════════════════════════════════
        //  ATTENDANCE SYSTEM - متكامل مع قاعدة الإجازات
        // ═══════════════════════════════════════════════

        /**
         * دالة مساعدة: التحقق من وجود إجازة نشطة للموظف في تاريخ معين
         * @param {string} memberName - اسم الموظف
         * @param {string} dateStr - التاريخ بصيغة YYYY-MM-DD
         * @returns {object|null} - سجل الإجازة النشط أو null
         */
        function getActiveLeaveForMember(memberName, dateStr) {
            if (!dateStr || !allRecords.length) return null;
            const checkDate = new Date(dateStr);
            if (isNaN(checkDate.getTime())) return null;
            // نبحث عن أي إجازة يكون تاريخ الفحص بين تاريخ البداية والنهاية
            return allRecords.find(rec => {
                if (rec.name !== memberName) return false;
                const start = new Date(rec.start);
                const end = new Date(rec.end);
                return checkDate >= start && checkDate <= end;
            }) || null;
        }

        /**
         * تحويل نوع الإجازة من النظام إلى حالة التحضير
         */
        function mapLeaveTypeToAttendanceStatus(leaveType) {
            const map = {
                'سنوية': 'annual',
                'عرضية': 'casual',
                'مرضية': 'sick',
                'مرخوص': 'permission',
                'أخرى': 'casual'
            };
            return map[leaveType] || 'casual';
        }

        const AttendanceModule = {
            members: [
                "يوسف الحجري", "نايف الكربي", "محمد ناصر", "امداد شاه", "محمد الغالي",
                "سمير عيساوي", "عبد الرحمن ناجي", "مصعب بري", "صالح عوض", "عثمان جافيد",
                "عبد الباسط", "شير علي", "سالم ابراهيم", "فضل طه", "فوزي يورو",
                "حميد الطاهر", "محمد توفيق", "خالد العنسي"
            ],
            statuses: [
                { key: 'present', label: 'متواجد', class: 'att-present' },
                { key: 'permission', label: 'مرخص', class: 'att-permission' },
                { key: 'sick', label: 'مرضيه', class: 'att-sick' },
                { key: 'annual', label: 'إجازه سنويه', class: 'att-annual' },
                { key: 'casual', label: 'عرضيه', class: 'att-casual' },
                { key: 'course', label: 'دوره', class: 'att-course' }
            ],
            selections: {},
            patrolAssignments: {},
            patrolNumbers: ['1', '2'],
            currentPatrolCount: 2,

            init() {
                this.selections = {};
                this.patrolAssignments = {};
                this.patrolNumbers = ['1', '2'];
                this.currentPatrolCount = 2;

                const dateInput = document.getElementById('attendanceDate');
                if (dateInput) {
                    const today = new Date();
                    dateInput.value =
                        `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
                    // مستمع لتغيير التاريخ - يعيد تطبيق الإجازات تلقائياً
                    dateInput.addEventListener('change', () => this.autoApplyLeaves());
                }

                // التطبيق التلقائي للإجازات عند التهيئة
                this.autoApplyLeaves();
                this.renderAll();
                this.setupPatrolNumbers();
            },

            /**
             * التطبيق التلقائي للإجازات من قاعدة البيانات
             * يفحص كل عضو ويضبط حالته بناءً على الإجازات المسجلة
             */
            autoApplyLeaves() {
                const dateInput = document.getElementById('attendanceDate');
                const dateStr = dateInput ? dateInput.value : '';
                if (!dateStr) return;

                let autoAppliedCount = 0;
                this.members.forEach(member => {
                    const activeLeave = getActiveLeaveForMember(member, dateStr);
                    if (activeLeave) {
                        const statusKey = mapLeaveTypeToAttendanceStatus(activeLeave.type);
                        if (statusKey) {
                            this.selections[member] = statusKey;
                            // حذف من توزيع الدوريات إذا كان غير متواجد
                            delete this.patrolAssignments[member];
                            autoAppliedCount++;
                        }
                    } else {
                        // إذا لم تكن هناك إجازة نشطة ولم يتم تحديد حالة مسبقاً، نعينها كمتواجد افتراضياً
                        if (!this.selections[member]) {
                            this.selections[member] = 'present';
                        }
                    }
                });

                if (autoAppliedCount > 0) {
                    toast(`🔄 تم تطبيق ${autoAppliedCount} إجازة تلقائياً من قاعدة البيانات`, 'green');
                }
            },

            /**
             * التحقق مما إذا كان الموظف لديه إجازة نشطة في التاريخ الحالي
             */
            hasActiveLeave(memberName) {
                const dateInput = document.getElementById('attendanceDate');
                const dateStr = dateInput ? dateInput.value : '';
                return getActiveLeaveForMember(memberName, dateStr) !== null;
            },

            /**
             * الحصول على تفاصيل الإجازة النشطة للموظف
             */
            getActiveLeaveInfo(memberName) {
                const dateInput = document.getElementById('attendanceDate');
                const dateStr = dateInput ? dateInput.value : '';
                return getActiveLeaveForMember(memberName, dateStr);
            },

            getStatusLabel(statusKey) {
                const found = this.statuses.find(s => s.key === statusKey);
                return found ? found.label : 'غير محدد';
            },

            getPresentMembers() { return this.members.filter(m => this.selections[m] === 'present'); },
            getUnassignedPresentMembers() { return this.getPresentMembers().filter(m => !(m in this.patrolAssignments)); },
            getAssignedMembersForPatrol(patrolLabel) {
                return Object.entries(this.patrolAssignments)
                    .filter(([name, pLabel]) => pLabel === patrolLabel && this.selections[name] === 'present')
                    .map(([name]) => name);
            },

            renderAll() { this.renderMemberList();
                this.updateSummary();
                this.renderAbsentSection();
                this.refreshPatrolUI(); },

            renderMemberList() {
                const container = document.getElementById('attMemberList');
                if (!container) return;
                container.innerHTML = '';
                const dateInput = document.getElementById('attendanceDate');
                const dateStr = dateInput ? dateInput.value : '';

                this.members.forEach((member, index) => {
                    const activeLeave = getActiveLeaveForMember(member, dateStr);
                    const isAutoApplied = activeLeave !== null;

                    const row = document.createElement('div');
                    row.className = 'att-member-row';
                    if (isAutoApplied) {
                        row.classList.add('att-row-auto');
                    }

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'att-member-name';
                    nameSpan.textContent = `${index + 1}. ${member}`;

                    // إضافة شارة تلقائي إذا كانت هناك إجازة نشطة
                    if (isAutoApplied) {
                        const autoBadge = document.createElement('span');
                        autoBadge.className = 'att-auto-badge att-auto-locked';
                        autoBadge.textContent = `🔄 ${activeLeave.type} (تلقائي)`;
                        autoBadge.title = `إجازة ${activeLeave.type} من ${activeLeave.start} إلى ${activeLeave.end}`;
                        nameSpan.appendChild(autoBadge);
                    }

                    const buttonsDiv = document.createElement('div');
                    buttonsDiv.className = 'att-status-buttons';

                    this.statuses.forEach(status => {
                        const btn = document.createElement('button');
                        btn.className = `att-status-btn ${status.class}`;
                        btn.textContent = status.label;
                        if (this.selections[member] === status.key) btn.classList.add('att-active');

                        // إذا كانت هناك إجازة تلقائية، نمنع تغيير الحالة يدوياً
                        if (isAutoApplied) {
                            btn.style.opacity = '0.4';
                            btn.style.cursor = 'not-allowed';
                            btn.title = `هذا العضو لديه إجازة ${activeLeave.type} مسجلة تلقائياً`;
                        } else {
                            btn.addEventListener('click', () => this.selectStatus(member, status.key));
                        }

                        buttonsDiv.appendChild(btn);
                    });

                    row.appendChild(nameSpan);
                    row.appendChild(buttonsDiv);
                    container.appendChild(row);
                });
            },

            selectStatus(member, statusKey) {
                // منع التغيير اليدوي إذا كانت هناك إجازة نشطة
                const dateInput = document.getElementById('attendanceDate');
                const dateStr = dateInput ? dateInput.value : '';
                const activeLeave = getActiveLeaveForMember(member, dateStr);

                if (activeLeave) {
                    const autoStatus = mapLeaveTypeToAttendanceStatus(activeLeave.type);
                    toast(`⚠️ ${member} لديه إجازة ${activeLeave.type} مسجلة تلقائياً`, 'amber');
                    return;
                }

                if (this.selections[member] !== statusKey) {
                    this.selections[member] = statusKey;
                    if (statusKey !== 'present') delete this.patrolAssignments[member];
                }
                this.renderAll();
            },

            updateSummary() {
                const total = this.members.length;
                let present = 0,
                    absent = 0;
                this.members.forEach(member => {
                    const sel = this.selections[member];
                    if (sel === 'present') present++;
                    else if (sel && sel !== 'present') absent++;
                });
                const tc = document.getElementById('attTotalCount');
                const pc = document.getElementById('attPresentCount');
                const ac = document.getElementById('attAbsentCount');
                if (tc) tc.textContent = total;
                if (pc) pc.textContent = present;
                if (ac) ac.textContent = absent;
            },

            renderAbsentSection() {
                const categories = {
                    permission: { containerId: 'attPermissionList', cssClass: 'att-permission' },
                    sick: { containerId: 'attSickList', cssClass: 'att-sick' },
                    annual: { containerId: 'attAnnualList', cssClass: 'att-annual' },
                    casual: { containerId: 'attCasualList', cssClass: 'att-casual' },
                    course: { containerId: 'attCourseList', cssClass: 'att-course' }
                };
                for (const [key, config] of Object.entries(categories)) {
                    const container = document.getElementById(config.containerId);
                    if (!container) continue;
                    const filteredMembers = this.members.filter(m => this.selections[m] === key);
                    if (filteredMembers.length === 0) {
                        container.innerHTML = '<span style="color:#bdc3c7;font-size:12px;">لا يوجد</span>';
                    } else {
                        container.innerHTML = filteredMembers.map(m => {
                            const leaveInfo = this.getActiveLeaveInfo(m);
                            const extraInfo = leaveInfo ?
                                ` (${leaveInfo.start} → ${leaveInfo.end})` : '';
                            return `<span class="att-absent-tag ${config.cssClass}" title="${m}${extraInfo}">${m}${extraInfo}</span>`;
                        }).join('');
                    }
                }
            },

            setupPatrolNumbers() {
                const input = document.getElementById('attPatrolCount');
                if (!input) return;
                let count = parseInt(input.value, 10);
                if (isNaN(count) || count < 1) count = 1;
                if (count > 10) count = 10;
                input.value = count;
                this.currentPatrolCount = count;
                const oldNumbers = [...this.patrolNumbers];
                this.patrolNumbers = [];
                for (let i = 0; i < count; i++) {
                    if (i < oldNumbers.length && oldNumbers[i].trim() !== '') this.patrolNumbers.push(oldNumbers[i]);
                    else this.patrolNumbers.push(String(i + 1));
                }
                const validLabels = new Set(this.patrolNumbers);
                Object.keys(this.patrolAssignments).forEach(member => {
                    if (!validLabels.has(this.patrolAssignments[member])) delete this.patrolAssignments[member];
                });
                this.renderPatrolNumbersInputs();
                this.refreshPatrolUI();
            },

            renderPatrolNumbersInputs() {
                const container = document.getElementById('attPatrolNumbersSetup');
                if (!container) return;
                container.innerHTML = '';
                this.patrolNumbers.forEach((num, index) => {
                    const div = document.createElement('div');
                    div.className = 'att-patrol-number-input';
                    const label = document.createElement('label');
                    label.textContent = `🔹 دورية ${index + 1} رقم:`;
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = num;
                    input.placeholder = 'مثال: 1 أو A';
                    input.addEventListener('input', e => this.updatePatrolNumber(index, e.target.value));
                    div.appendChild(label);
                    div.appendChild(input);
                    container.appendChild(div);
                });
            },

            updatePatrolNumber(index, newValue) {
                const oldLabel = this.patrolNumbers[index];
                const newLabel = newValue.trim() === '' ? String(index + 1) : newValue.trim();
                this.patrolNumbers[index] = newLabel;
                if (oldLabel !== newLabel) {
                    Object.keys(this.patrolAssignments).forEach(member => {
                        if (this.patrolAssignments[member] === oldLabel) this.patrolAssignments[member] =
                            newLabel;
                    });
                }
                this.refreshPatrolUI();
            },

            refreshPatrolUI() { this.renderAvailableMembers();
                this.renderPatrolColumns(); },

            renderAvailableMembers() {
                const container = document.getElementById('attAvailableMembersContainer');
                if (!container) return;
                const unassigned = this.getUnassignedPresentMembers();
                if (unassigned.length === 0) {
                    container.innerHTML = '<span style="color:#95a5a6;font-size:13px;">جميع المتواجدين موزعون ✅</span>';
                    return;
                }
                container.innerHTML = '';
                unassigned.forEach(member => {
                    const chip = document.createElement('span');
                    chip.className = 'att-member-chip';
                    chip.textContent = member;
                    chip.title = 'اضغط للإضافة إلى الدورية المحددة';
                    container.appendChild(chip);
                });
            },

            renderPatrolColumns() {
                const container = document.getElementById('attPatrolColumnsContainer');
                if (!container) return;
                container.innerHTML = '';
                this.patrolNumbers.forEach((patrolLabel) => {
                    const column = document.createElement('div');
                    column.className = 'att-patrol-column';
                    const header = document.createElement('h4');
                    header.innerHTML = `🔹 <span class="att-badge">دورية ${patrolLabel}</span>`;
                    column.appendChild(header);

                    const addArea = document.createElement('div');
                    addArea.className = 'att-available-members';
                    addArea.style.marginBottom = '10px';
                    const unassigned = this.getUnassignedPresentMembers();
                    if (unassigned.length > 0) {
                        unassigned.forEach(member => {
                            const addBtn = document.createElement('span');
                            addBtn.className = 'att-member-chip';
                            addBtn.textContent = `➕ ${member}`;
                            addBtn.style.cursor = 'pointer';
                            addBtn.addEventListener('click', () => this.assignMemberToPatrol(member,
                                patrolLabel));
                            addArea.appendChild(addBtn);
                        });
                    } else {
                        addArea.innerHTML =
                            '<span style="color:#95a5a6;font-size:12px;">لا يوجد متواجدين متاحين</span>';
                    }
                    column.appendChild(addArea);

                    const assignedList = document.createElement('div');
                    assignedList.className = 'att-assigned-list';
                    const assignedMembers = this.getAssignedMembersForPatrol(patrolLabel);
                    if (assignedMembers.length > 0) {
                        assignedMembers.forEach(member => {
                            const tag = document.createElement('span');
                            tag.className = 'att-assigned-tag';
                            tag.innerHTML =
                                `${member} <button class="att-remove-btn" title="إزالة">&times;</button>`;
                            tag.querySelector('.att-remove-btn').addEventListener('click', () => this
                                .removeMemberFromPatrol(member));
                            assignedList.appendChild(tag);
                        });
                    } else {
                        assignedList.innerHTML =
                            '<span style="color:#bdc3c7;font-size:13px;">فارغة</span>';
                    }
                    column.appendChild(assignedList);
                    container.appendChild(column);
                });
            },

            assignMemberToPatrol(member, patrolLabel) {
                if (this.selections[member] !== 'present') {
                    toast('⚠️ هذا العضو غير متواجد!', 'amber');
                    return;
                }
                // تحقق إضافي: هل الموظف لديه إجازة نشطة؟
                const dateInput = document.getElementById('attendanceDate');
                const dateStr = dateInput ? dateInput.value : '';
                if (getActiveLeaveForMember(member, dateStr)) {
                    toast(`🚫 ${member} لديه إجازة مسجلة`, 'red');
                    return;
                }
                this.patrolAssignments[member] = patrolLabel;
                this.refreshPatrolUI();
            },

            removeMemberFromPatrol(member) { delete this.patrolAssignments[member];
                this.refreshPatrolUI(); },

            copyTable() {
                const dateInput = document.getElementById('attendanceDate');
                let dateValue = dateInput ? dateInput.value : '';
                let formattedDate = dateValue;
                if (dateValue) {
                    const parts = dateValue.split('-');
                    if (parts.length === 3) formattedDate = `${parts[2]} / ${parts[1]} / ${parts[0]}`;
                } else formattedDate = '______';

                let text = `📋 تقرير تحضير الفريق - تاريخ: ${formattedDate}\n`;
                text += `══════════════════════════\n\n👥 حالة الأعضاء:\n──────────────────────────────\n`;
                this.members.forEach((member, index) => {
                    const statusKey = this.selections[member];
                    const statusLabel = statusKey ? this.getStatusLabel(statusKey) : '⏳ لم يحدد';
                    const emoji = statusKey === 'present' ? '✅' : (statusKey ? '❌' : '⬜');
                    // إضافة تفاصيل الإجازة إذا كانت موجودة
                    const leaveInfo = this.getActiveLeaveInfo(member);
                    const leaveDetails = leaveInfo ?
                        ` [${leaveInfo.type} ${leaveInfo.start} → ${leaveInfo.end}]` : '';
                    text += `${index + 1}. ${member}: ${emoji} ${statusLabel}${leaveDetails}\n`;
                });
                const total = this.members.length;
                let present = 0,
                    absent = 0;
                this.members.forEach(member => {
                    const sel = this.selections[member];
                    if (sel === 'present') present++;
                    else if (sel && sel !== 'present') absent++;
                });
                text +=
                    `\n──────────────────────────────\n👥 الإجمالي: ${total} | ✅ متواجد: ${present} | ❌ غياب: ${absent}\n`;
                const absentCategories = [
                    { key: 'permission', label: '🟠 مرخص' }, { key: 'sick', label: '🔴 مرضيه' },
                    { key: 'annual', label: '🟣 إجازه سنويه' }, { key: 'casual', label: '🔵 عرضيه' },
                    { key: 'course', label: '🩵 دوره' }
                ];
                let hasAbsent = false;
                for (const cat of absentCategories) {
                    const catMembers = this.members.filter(m => this.selections[m] === cat.key);
                    if (catMembers.length > 0) {
                        if (!hasAbsent) { text +=
                                `\n📌 الغيابات والإجازات:\n──────────────────────────────\n`;
                            hasAbsent = true; }
                        const memberDetails = catMembers.map(m => {
                            const leaveInfo = this.getActiveLeaveInfo(m);
                            return leaveInfo ? `${m} (${leaveInfo.start} → ${leaveInfo.end})` : m;
                        });
                        text += `${cat.label}: ${memberDetails.join(' | ')}\n`;
                    }
                }
                if (this.patrolNumbers.length > 0 && Object.keys(this.patrolAssignments).length > 0) {
                    text += `\n🔄 توزيع الدوريات:\n──────────────────────────────\n`;
                    this.patrolNumbers.forEach(patrolLabel => {
                        const membersInPatrol = this.getAssignedMembersForPatrol(patrolLabel);
                        text += membersInPatrol.length > 0 ?
                            `🔹 دورية ${patrolLabel}: ${membersInPatrol.join(' | ')}\n` :
                            `🔹 دورية ${patrolLabel}: (فارغة)\n`;
                    });
                }
                text += `\n══════════════════════════\n`;
                const textarea = document.getElementById('hiddenCopyArea');
                textarea.value = text;
                textarea.style.display = 'block';
                textarea.select();
                textarea.setSelectionRange(0, 99999);
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(text).then(() => this.showCopiedMessage()).catch(() => {
                            document.execCommand('copy');
                            this.showCopiedMessage();
                        });
                    } else {
                        document.execCommand('copy');
                        this.showCopiedMessage();
                    }
                } catch (e) {
                    document.execCommand('copy');
                    this.showCopiedMessage();
                }
                textarea.style.display = 'none';
            },

            showCopiedMessage() {
                const msg = document.getElementById('attCopiedMessage');
                if (msg) { msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; }, 2500); }
            }
        };

        // ═══════════════ ATTENDANCE MODAL ═══════════════
        async function showAttendancePin() {
            // تأكد من تحميل البيانات قبل عرض المودال
            await ensureDataLoaded();
            const modal = document.getElementById('attendanceModal');
            const content = document.getElementById('attendanceModalContent');
            content.innerHTML = `
            <div class="att-inner" style="text-align:center;padding:30px;">
                <h3 style="color:#2c3e50;">🔐 رمز الدخول</h3>
                <p style="color:#7f8c8d;">أدخل الرمز لفتح نظام تحضير الفريق وتقسيم الدوريات:</p>
                <p style="font-size:12px;color:#3498db;background:#eaf2f8;padding:8px;border-radius:8px;">💡 النظام يتكامل تلقائياً مع قاعدة الإجازات</p>
                <input type="password" id="attendancePinInput" class="pin-input" placeholder="****" maxlength="10" autocomplete="off">
                <br><button class="pin-btn" onclick="checkAttendancePin()">تحقق</button>
                <p id="attendancePinError" class="pin-error" style="display:none;">❌ الرمز غير صحيح</p>
                <button class="att-close-btn" style="margin-top:15px;" onclick="document.getElementById('attendanceModal').style.display='none'">إغلاق</button>
            </div>`;
            modal.style.display = 'flex';
            setTimeout(() => { const inp = document.getElementById('attendancePinInput'); if (inp) inp.focus(); }, 200);
        }

        async function checkAttendancePin() {
            const input = document.getElementById('attendancePinInput');
            if (!input) return;
            if (btoa(input.value.trim()) === CORRECT_PIN_ENCODED) {
                // تأكد من أن البيانات محدثة قبل فتح الواجهة
                await ensureDataLoaded();
                loadAttendanceContent();
            } else {
                const err = document.getElementById('attendancePinError');
                if (err) err.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }

        function loadAttendanceContent() {
            const content = document.getElementById('attendanceModalContent');
            content.innerHTML = `
            <div class="att-inner">
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2c3e50; color:white; padding:10px 16px; border-radius:12px 12px 0 0; margin:-16px -16px 20px -16px;">
                    <span style="font-weight:700; font-size:16px;">📋 جدول تحضير الفريق</span>
                    <button onclick="document.getElementById('attendanceModal').style.display='none'" style="background:transparent; border:1px solid white; color:white; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:var(--font); font-weight:600;">✕ إغلاق</button>
                </div>
                <div class="att-header"><h2>📋 جدول تحضير الفريق</h2><div class="att-subtitle">🔄 متكامل تلقائياً مع قاعدة الإجازات | اختر الحالة لكل عضو | ثم وزع المتواجدين على الدوريات</div></div>
                <div class="att-date-box"><label for="attendanceDate">📅 التاريخ:</label><input type="date" id="attendanceDate"><span style="font-size:11px;color:#7f8c8d;">🔄 تغيير التاريخ يعيد تطبيق الإجازات تلقائياً</span></div>
                <div class="att-legend"><span>🟢 متواجد</span><span>🟠 مرخص</span><span>🔴 مرضيه</span><span>🟣 سنويه</span><span>🔵 عرضيه</span><span>🩵 دوره</span><span style="background:#e8f0fe;color:#1a56db;">🔄 تلقائي من النظام</span></div>
                <div class="att-section-title">👥 حالة الأعضاء</div>
                <div class="att-member-list" id="attMemberList"></div>
                <div class="att-summary-box"><span>👥 الإجمالي: <strong id="attTotalCount">0</strong></span><span>✅ متواجد: <strong id="attPresentCount">0</strong></span><span>❌ غياب: <strong id="attAbsentCount">0</strong></span></div>
                <div class="att-absent-section">
                    <div class="att-section-title" style="margin-top:0;border-bottom-color:#e74c3c;">📌 الغيابات والإجازات</div>
                    <div class="att-absent-grid">
                        <div class="att-absent-category"><h5>🟠 مرخص</h5><div id="attPermissionList"></div></div>
                        <div class="att-absent-category"><h5>🔴 مرضيه</h5><div id="attSickList"></div></div>
                        <div class="att-absent-category"><h5>🟣 إجازه سنويه</h5><div id="attAnnualList"></div></div>
                        <div class="att-absent-category"><h5>🔵 عرضيه</h5><div id="attCasualList"></div></div>
                        <div class="att-absent-category"><h5>🩵 دوره</h5><div id="attCourseList"></div></div>
                    </div>
                </div>
                <div class="att-patrol-section">
                    <div class="att-section-title" style="margin-top:0;border-bottom-color:#f39c12;">🔄 تقسيم الدوريات (يدوي)</div>
                    <div class="att-patrol-setup-area"><label for="attPatrolCount">🔢 كم دورية تريد؟</label><input type="number" id="attPatrolCount" min="1" max="10" value="2"><button onclick="AttendanceModule.setupPatrolNumbers()">✅ إنشاء خانات أرقام الدوريات</button></div>
                    <div class="att-patrol-numbers-setup" id="attPatrolNumbersSetup"></div>
                    <p style="text-align:center;font-weight:600;color:#2c3e50;margin-bottom:10px;">🟢 اضغط على اسم المتواجد لإضافته إلى الدورية المطلوبة:</p>
                    <div style="background:#f0faf7;border-radius:12px;padding:12px;margin-bottom:15px;"><strong style="color:#0e6655;">👤 متواجدون لم يتم توزيعهم بعد:</strong><div class="att-available-members" id="attAvailableMembersContainer"></div></div>
                    <div class="att-patrol-columns" id="attPatrolColumnsContainer"></div>
                </div>
                <div class="att-copy-area">
                    <button class="att-copy-btn" onclick="AttendanceModule.copyTable()">📋 نسخ التقرير الكامل للإرسال</button>
                    <span class="att-copied-msg" id="attCopiedMessage">✅ تم النسخ! ألصقه في الواتساب أو أي مكان.</span>
                </div>
                <button class="att-close-btn" onclick="document.getElementById('attendanceModal').style.display='none'">✕ إغلاق</button>
            </div>`;
            AttendanceModule.init();
        }

        // ═══════════════ EVENT LISTENERS ═══════════════
        document.getElementById('priorityModal').addEventListener('click', function(e) { if (e.target === this) this.style
                .display = 'none'; });
        document.getElementById('schedulerModal').addEventListener('click', function(e) { if (e.target === this) this.style
                .display = 'none'; });
        document.getElementById('attendanceModal').addEventListener('click', function(e) { if (e.target === this) this.style
                .display = 'none'; });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                const priorityModal = document.getElementById('priorityModal');
                const schedulerModal = document.getElementById('schedulerModal');
                const attendanceModal = document.getElementById('attendanceModal');
                if (document.getElementById('priorityPinInput') && priorityModal.style.display === 'flex')
                    checkPriorityPin();
                if (document.getElementById('schedulerPinInput') && schedulerModal.style.display === 'flex')
                    checkSchedulerPin();
                if (document.getElementById('attendancePinInput') && attendanceModal.style.display === 'flex')
                    checkAttendancePin();
            }
        });

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (typeof saveSchedulerLS === 'function' && document.getElementById('schedulerModal').style
                    .display === 'flex') saveSchedulerLS();
            }
            if (e.key === 'Escape') {
                document.getElementById('schedulerModal').style.display = 'none';
                document.getElementById('priorityModal').style.display = 'none';
                document.getElementById('attendanceModal').style.display = 'none';
            }
        });

        window.addEventListener('beforeunload', function(e) {
            if (rows.length > 0 && document.getElementById('schedulerModal').style.display === 'flex') {
                try { localStorage.setItem('sched_v3', JSON.stringify({ rows: rows.map(r => ({ id: r.id,
                            date: r.date, period: r.period, names: [...r.names], time: r.time })),
                        counter: rowCounter })); } catch (ex) {}
            }
        });

        console.log('✅ نظام Vo3b المتكامل جاهز | التكامل التلقائي مع الإجازات مفعّل');
    </script>
